<title>카드룸 포커 · 손익 랭킹</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위쪽 상대 3명, 가운데 팟과 공유 카드, 아래쪽 내 자리와 행동 버튼. 로그는 맨 아래.
   어두운 카드룸 한 가지 룩으로 고정 */
:root{
  --bg:#0d1512; --ink:#ece7da; --muted:#9db0a6; --line:#2b4238;
  --felt:#15392e; --felt2:#0e2a21; --rail:#3a2a1a; --seat:#0f2820;
  --brass:#dcb45c; --on-brass:#1b1405; --card:#f7f4ec; --card-ink:#1a1a1a; --card-red:#c22d2d;
  --back:#27408b; --ok:#6fd49a; --bad:#ff8a7a; --btn:#1c3329;
  --display:"Black Han Sans","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,38px);margin:0;line-height:1.1;letter-spacing:.5px}
.sub{color:var(--muted);font-size:12px}
.hd-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.net{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.notice{border:1px dashed var(--line);padding:8px 12px;font-size:12px;color:var(--muted)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mode{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--felt2);border:2px solid var(--line)}
.mode:hover{border-color:var(--brass)}
.mode b{font-family:var(--display);font-weight:400;font-size:26px}
.mode span{color:var(--muted);font-size:13px}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:12px}
.table{background:radial-gradient(ellipse at 50% 45%,var(--felt) 0,var(--felt2) 100%);border:6px solid var(--rail);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:14px}
.bots{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.seat{background:var(--seat);border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seat.turn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.seat.out{opacity:.5}
.seat.won{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sh b{font-weight:700}
.chips{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.st{display:flex;gap:6px;flex-wrap:wrap;min-height:20px;font-size:11px;align-items:center}
.pill{border:1px solid currentColor;padding:0 6px;color:var(--muted)}
.pill.d{color:var(--brass)}.pill.b{color:var(--ink)}
.cards{display:flex;gap:4px;flex-wrap:wrap;min-height:44px}
.card{width:30px;height:42px;background:var(--card);color:var(--card-ink);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px;line-height:1.05;font-family:var(--mono);border:1px solid #0006}
.card.red{color:var(--card-red)}
.card.back{background:repeating-linear-gradient(45deg,var(--back) 0 4px,#1d2f6b 4px 8px);border-color:#9fb2ee66}
.card.dn{outline:2px dashed #0007;outline-offset:-4px}
.card.empty{background:transparent;border:1px dashed var(--line)}
.me .card,.board .card{width:clamp(34px,9.5vw,50px);height:clamp(48px,13vw,70px);font-size:clamp(13px,3.4vw,18px)}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.pot{font-family:var(--mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--brass)}
.board{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.msg{min-height:22px;text-align:center;font-weight:700}
.hand{font-size:12px;color:var(--brass)}
.panel{background:var(--seat);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.acts{grid-template-columns:minmax(0,1fr)}}
.acts button{padding:12px 8px;font-weight:700}
.acts .raise{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.rz{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rz input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--brass)}
.rz input[type=number]{width:110px;font:inherit;font-family:var(--mono);padding:6px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.rz .q{display:flex;gap:6px;flex-wrap:wrap}
.rz .q button{padding:4px 8px;font-size:12px}
.log{border:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-family:var(--mono)}
.log div:first-child{color:var(--ink)}
.big{font-size:15px;padding:12px 16px;background:var(--brass);color:var(--on-brass);border-color:var(--brass);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rank{display:flex;flex-direction:column;gap:14px}
.rank h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--seat);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{color:var(--muted);font-size:12px}.stat b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.nick input{font:inherit;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);width:180px;max-width:100%}
.tw{overflow-x:auto}
table.lb{width:100%;border-collapse:collapse;font-size:13px}
.lb th,.lb td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.lb th:nth-child(2),.lb td:nth-child(2){text-align:left;width:100%}
.lb th{color:var(--muted);font-weight:500;font-size:12px}
.lb td{font-family:var(--mono);font-variant-numeric:tabular-nums}.lb td:nth-child(2){font-family:var(--body)}
.lb tr.me td{background:#dcb45c22;color:var(--brass)}
.lb .top1{color:var(--brass);font-weight:700}
.lang{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);padding:8px 6px;max-width:130px}
</style>

<div class="app">
  <header>
    <div>
      <h1 id="ti"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hd-r">
      <select class="lang" id="lang" aria-label="Language"></select>
      <span class="sub"><span id="nl"></span> <span class="net" id="net">0P</span></span>
      <button id="rk"></button>
      <button id="chg" hidden></button>
    </div>
  </header>
  <div class="notice" id="nt"></div>

  <div class="menu" id="menu"></div>

  <main id="game" hidden>
    <div class="table">
      <div class="bots" id="bots"></div>
      <div class="mid" id="mid"></div>
      <div id="me"></div>
    </div>
    <div class="panel" id="panel" style="margin-top:14px"></div>
    <div class="log" id="log" style="margin-top:14px"></div>
  </main>
  <section class="rank" id="rank" hidden></section>
</div>

function straightHi(rs){const s=new Set(rs);if(s.has(14))s.add(1);for(let h=14;h>=5;h--){let ok=true;for(let k=0;k<5;k++)if(!s.has(h-k)){ok=false;break}if(ok)return h}return 0}
const mk=(cat,a)=>{let s=cat;for(let i=0;i<5;i++)s=s*15+(a[i]||0);return{score:s,cat,hi:a[0]}};
function evalH(cs){
  const rc=Array(15).fill(0),sc=[[],[],[],[]];
  for(const c of cs){rc[rk(c)]++;sc[su(c)].push(rk(c))}
  const fs=sc.findIndex(a=>a.length>=5);
  if(fs>=0){const h=straightHi(sc[fs]);if(h)return mk(8,[h])}
  const q=[],t=[],p=[],all=[];
  for(let r=14;r>=2;r--){if(rc[r]>0)all.push(r);if(rc[r]==4)q.push(r);else if(rc[r]==3)t.push(r);else if(rc[r]==2)p.push(r)}
  const oth=ex=>all.filter(r=>!ex.includes(r));
  if(q.length)return mk(7,[q[0],oth([q[0]])[0]]);
  if(t.length&&(t.length>1||p.length))return mk(6,[t[0],Math.max(p[0]||0,t[1]||0)]);
  if(fs>=0)return mk(5,sc[fs].slice().sort((a,b)=>b-a).slice(0,5));
  const sh=straightHi(all);if(sh)return mk(4,[sh]);
  if(t.length)return mk(3,[t[0],...oth([t[0]]).slice(0,2)]);
  if(p.length>=2)return mk(2,[p[0],p[1],oth([p[0],p[1]])[0]]);
  if(p.length==1)return mk(1,[p[0],...oth([p[0]]).slice(0,3)]);
  return mk(0,all.slice(0,5));
}

  if(type=='fold'){p.folded=true;log(t('lFold',p.name))}
  else if(type=='check'){p.acted=true;log(t('lCheck',p.name))}
  else if(type=='call'){const pay=Math.min(toCall,p.chips);p.chips-=pay;p.bet+=pay;p.total+=pay;G.pot+=pay;if(!p.chips)p.allIn=true;p.acted=true;log(t('lCall',p.name,fmt(pay))+(p.allIn?t('allinP'):''))}
  else{const r=raiseRange(i);to=Math.max(r.min,Math.min(to,p.bet+p.chips));const pay=to-p.bet;const was=G.cur;
    p.chips-=pay;p.bet=to;p.total+=pay;G.pot+=pay;if(!p.chips)p.allIn=true;
    if(to>G.cur){if(G.mode=='holdem')G.minRaise=Math.max(G.minRaise,to-G.cur);G.cur=to;G.P.forEach(q=>{if(q!==p)q.acted=false});G.raises++}
    p.acted=true;log(t(was==0?'lBet':'lRaise',p.name,fmt(to))+(p.allIn?t('allinP'):''))}
  G.toAct=(i+1)%4;loop();
}

function advance(){
  if(alive().length==1)return settle(false);
  if(G.street>=final())return settle(true);
  G.street++;
  if(G.mode=='holdem'){const n=G.street==1?3:1;for(let k=0;k<n;k++)G.board.push(G.deck.pop());log(t(G.street==1?'flop':G.street==2?'trn':'rvr'))}
  else{G.P.forEach(p=>{if(!p.folded)p.cards.push({c:G.deck.pop(),dn:G.street==4})});log(t('cardN',G.street+3))}
  G.P.forEach(p=>{p.bet=0;p.acted=false});G.cur=0;G.raises=0;
  const ableCount=G.P.filter((p,i)=>can(i)).length;
  if(ableCount<2){render();later(advance,1000);return}
  const first=G.mode=='holdem'?nextCan((G.dealer+1)%4):nextCan(studFirst());
  beginBet(first,false);
}

function settle(showdown){
  const P=G.P;G.over=true;
  if(!showdown){const w=alive()[0];w.chips+=G.pot;w.won=true;G.msg=t('winF',w.name,fmt(G.pot));log(G.msg)}
  else{
    G.reveal=true;const sc={};P.forEach((p,i)=>{if(!p.folded)sc[i]=evalH(p.cards.map(x=>x.c).concat(G.board))});
    const lv=[...new Set(P.map(p=>p.total).filter(x=>x>0))].sort((a,b)=>a-b);let prev=0;const pay=P.map(()=>0);
    for(const L of lv){let slice=0;P.forEach(p=>{slice+=Math.max(0,Math.min(p.total,L)-Math.min(p.total,prev))});
      let el=P.map((p,i)=>i).filter(i=>!P[i].folded&&P[i].total>=L);if(!el.length)el=P.map((p,i)=>i).filter(i=>!P[i].folded);
      const top=Math.max(...el.map(i=>sc[i].score)),ws=el.filter(i=>sc[i].score==top);
      const sh=Math.floor(slice/ws.length);ws.forEach(i=>pay[i]+=sh);pay[ws[0]]+=slice-sh*ws.length;prev=L}
    const parts=[];P.forEach((p,i)=>{if(pay[i]>0){p.chips+=pay[i];p.won=true;parts.push(`${p.name} ${hname(sc[i])} ${fmt(pay[i])}`)}});
    G.msg=t('sd')+parts.join(' / ');log(G.msg);G.sc=sc;
  }
  G.pot=0;record(G.P[0].chips-G.s0);render();
}

/* ---------- 컴퓨터 상대 ---------- */
function equity(i,n){
  const me=G.P[i];let known=me.cards.map(x=>x.c).concat(G.board);
  if(G.mode=='stud')G.P.forEach((q,j)=>{if(j!=i)q.cards.forEach(x=>{if(!x.dn)known.push(x.c)})});
  const ks=new Set(known),un=[];for(let c=0;c<52;c++)if(!ks.has(c))un.push(c);
  const opps=G.P.map((q,j)=>j).filter(j=>j!=i&&!G.P[j].folded);
  const need=G.mode=='holdem'?(5-G.board.length)+2*opps.length:(7-me.cards.length)+opps.reduce((s,j)=>s+7-G.P[j].cards.filter(x=>!x.dn).length,0);
  let w=0;
  for(let s=0;s<n;s++){
    for(let k=0;k<need;k++){const r=k+Math.floor(Math.random()*(un.length-k));[un[k],un[r]]=[un[r],un[k]]}
    let idx=0,mine,os=[];
    if(G.mode=='holdem'){const b=G.board.concat(un.slice(idx,idx+5-G.board.length));idx+=5-G.board.length;mine=evalH(me.cards.map(x=>x.c).concat(b)).score;
      for(const j of opps){os.push(evalH([un[idx],un[idx+1]].concat(b)).score);idx+=2}}
    else{const m=7-me.cards.length;mine=evalH(known.slice(0,me.cards.length).concat(un.slice(idx,idx+m))).score;idx+=m;
      for(const j of opps){const v=G.P[j].cards.filter(x=>!x.dn).map(x=>x.c),m2=7-v.length;os.push(evalH(v.concat(un.slice(idx,idx+m2))).score);idx+=m2}}
    const top=Math.max(...os,-1);if(mine>top)w+=1;else if(mine==top)w+=1/(1+os.filter(x=>x==top).length)}
  return w/n;
}
function botAct(i){
  const p=G.P[i],toCall=G.cur-p.bet,e=equity(i,G.mode=='holdem'&&G.street==0?220:140),cr=canRaise(i),pot=G.pot;
  const rr=raiseRange(i);
  const size=()=>{if(G.mode=='stud')return rr.min;let t=G.cur+Math.max(G.minRaise,Math.round(pot*(0.3+0.5*e*p.ag)/100)*100);t=Math.min(t,p.bet+p.chips);if(e>0.88&&Math.random()<0.5)t=p.bet+p.chips;return t};
  if(toCall<=0){
    if(cr&&e>0.5+p.ti*0.12&&Math.random()<0.45+p.ag*0.5)return act(i,'raise',size());
    if(cr&&e>0.28&&Math.random()<0.06*p.ag*2)return act(i,'raise',rr.min);
    return act(i,'check');
  }
  const po=toCall/(pot+toCall),need=po+0.04+p.ti*0.06+(toCall>=p.chips?0.05:0);
  if(cr&&e>0.74&&Math.random()<0.35+p.ag*0.55)return act(i,'raise',size());
  if(e>=need||Math.random()<0.03)return act(i,'call');
  act(i,'fold');
}

/* ---------- 화면 ---------- */
const cardH=(c,down,cls)=>`<div class="card ${RED[su(c)]?'red':''} ${down?'dn':''} ${cls||''}" aria-label="${SU[su(c)]} ${RL(rk(c))}"><span>${RL(rk(c))}</span><span>${SU[su(c)]}</span></div>`;
const backH=()=>`<div class="card back" aria-label="${t('cb')}"></div>`;
function seatCards(i){
  const p=G.P[i],hide=!p.human&&!G.reveal;
  if(p.folded&&G.mode=='holdem')return `<span class="sub">${t('fold')}</span>`;
  return p.cards.map(x=>{if(hide&&x.dn)return backH();return cardH(x.c,x.dn&&G.mode=='stud')}).join('');
}
function seatHTML(i){
  const p=G.P[i],isT=!G.over&&G.toAct==i,pills=[];
  if(G.dealer==i)pills.push(`<span class="pill d">${t('dealer')}</span>`);
  if(G.mode=='holdem'&&G.hands&&i==(G.dealer+1)%4)pills.push('<span class="pill b">SB</span>');
  if(G.mode=='holdem'&&i==(G.dealer+2)%4)pills.push('<span class="pill b">BB</span>');
  if(p.folded)pills.push(`<span class="pill">${t('fold')}</span>`);
  if(p.allIn)pills.push(`<span class="pill d">${t('allin')}</span>`);
  if(p.bet>0&&!G.over)pills.push(`<span class="pill b">${t('bet',p.bet.toLocaleString(L))}</span>`);
  if(isT&&!p.human)pills.push(`<span class="pill d">${t('think')}</span>`);
  let hand='';
  if(G.over&&G.reveal&&G.sc&&G.sc[i])hand=`<div class="hand">${hname(G.sc[i])}</div>`;
  else if(p.human&&!p.folded&&p.cards.length){const e=evalH(p.cards.map(x=>x.c).concat(G.board));hand=`<div class="hand">${t('cur',hname(e))}</div>`}
  return `<div class="seat ${p.human?'me':''} ${isT?'turn':''} ${p.folded?'out':''} ${G.over&&p.won?'won':''}"><div class="sh"><b>${p.name}${p.tag?` <span class="sub">${p.tag}</span>`:''}</b><span class="chips">${fmt(p.chips)}</span></div><div class="st">${pills.join('')}</div><div class="cards">${seatCards(i)}</div>${hand}</div>`;
}
function render(){
  if(!G)return;
  $('bots').innerHTML=[1,2,3].map(seatHTML).join('');
  let mid=`<div class="pot">${t('pot',fmt(G.pot||0))}</div>`;
  if(G.mode=='holdem'){let b='';for(let k=0;k<5;k++)b+=G.board[k]!=null?cardH(G.board[k]):'<div class="card empty"></div>';mid+=`<div class="board" aria-label="${t('brd')}">${b}</div>`}
  else mid+=`<div class="sub">${t('rnd',G.street+3)}</div>`;
  mid+=`<div class="msg" role="status">${G.over?G.msg:''}</div>`;
  $('mid').innerHTML=mid;
  $('me').innerHTML=seatHTML(0);
  const n=net();$('net').textContent=(n>0?'+':'')+fmt(n);$('net').className='net '+(n>0?'pos':n<0?'neg':'');
  $('log').innerHTML=G.log.map(l=>`<div>${l}</div>`).join('');
  panel();
}
function panel(){
  const el=$('panel'),p=G.P[0];
  if(G.over){el.innerHTML=`<div class="row"><button class="big" id="next">${t('next')}</button><span class="sub">${t('chips',fmt(p.chips))}${p.chips<=0?t('refillNext'):''}</span></div>`;return}
  if(G.toAct!=0||p.folded||!can(0)){el.innerHTML=`<div class="sub">${p.folded?t('folded'):p.allIn?t('allinW'):t('turn',G.P[G.toAct].name)}</div>`;return}
  const toCall=G.cur-p.bet,cr=canRaise(0),r=raiseRange(0);
  if(G.raiseTo==null||G.raiseTo<r.min||G.raiseTo>r.max||G.rtHand!=G.hands+':'+G.street+':'+G.cur)G.raiseTo=r.min;G.rtHand=G.hands+':'+G.street+':'+G.cur;
  const callLbl=toCall<=0?t('check'):t('call',fmt(Math.min(toCall,p.chips)))+(toCall>=p.chips?t('allinP'):'');
  let rz='';
  if(cr&&G.mode=='holdem'&&r.max>r.min)rz=`<div class="rz"><input type="range" id="rs" aria-label="${t('rAmt')}" min="${r.min}" max="${r.max}" step="100" value="${G.raiseTo}"><input type="number" id="rn" aria-label="${t('rIn')}" min="${r.min}" max="${r.max}" step="100" value="${G.raiseTo}"><div class="q"><button data-q="min">${t('min')}</button><button data-q="half">${t('half')}</button><button data-q="pot">${t('potB')}</button><button data-q="all">${t('allB')}</button></div></div>`;
  const rLbl=t(G.cur==0?'raiseB':'raiseR');
  el.innerHTML=`<div class="acts"><button id="fold">${t('fold')}</button><button id="call">${callLbl}</button><button class="raise" id="raise" ${cr?'':'disabled'}>${cr?(G.mode=='stud'?`${rLbl} ${fmt(r.min)}`:`${rLbl} <span id="rl">${fmt(G.raiseTo)}</span>`+(G.raiseTo>=p.bet+p.chips?t('allinP'):'')):t('noRaise')}</button></div>${rz}`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mode)return startGame(t.dataset.mode);
  if(t.id=='rk')return showRank($('rank').hidden);
  if(t.id=='nsave'){S.name=($('nick').value||'').trim().slice(0,12);saveLocal();push(true);return renderRank()}
  if(t.id=='chg')return toMenu();
  if(!G)return;
  if(t.id=='next'&&G.over)return newHand();
  if(G.over||G.toAct!=0||!can(0))return;
  if(t.id=='fold'){if(G.cur-G.P[0].bet<=0)return act(0,'check');return act(0,'fold')}
  if(t.id=='call'){return act(0,G.cur-G.P[0].bet<=0?'check':'call')}
  if(t.id=='raise'){return act(0,'raise',G.raiseTo)}
  if(t.dataset.q){const p=G.P[0],r=raiseRange(0),pot=G.pot;let v=t.dataset.q=='min'?r.min:t.dataset.q=='all'?r.max:G.cur+Math.round((G.cur-p.bet+pot*(t.dataset.q=='half'?.5:1))/100)*100;v=Math.max(r.min,Math.min(r.max,v));G.raiseTo=v;panel()}
});
document.addEventListener('input',e=>{
  if(!G||(e.target.id!='rs'&&e.target.id!='rn'))return;
  const r=raiseRange(0),p=G.P[0];let v=Math.round((+e.target.value||0)/100)*100;
  if(e.target.id=='rs'){G.raiseTo=Math.max(r.min,Math.min(r.max,v));const n=$('rn');if(n)n.value=G.raiseTo}
  else{G.raiseTo=Math.max(r.min,Math.min(r.max,v||r.min));const s=$('rs');if(s)s.value=G.raiseTo}
  const l=$('rl');if(l)l.textContent=fmt(G.raiseTo);
});
const LI=$('lang');LI.innerHTML=Object.keys(LN).map(k=>`<option value="${k}">${LN[k]}</option>`).join('');
function applyLang(){
  LI.value=L;document.documentElement.lang=L;document.title=t('ti')+' · '+t('rh');
  $('ti').textContent=t('ti');$('nl').textContent=t('net');$('nt').textContent=t('notice');$('chg').textContent=t('chg');
  $('rk').textContent=$('rank').hidden?t('rank'):t('back');
  $('menu').innerHTML=['H','S'].map(k=>`<button class="mode" data-mode="${k=='H'?'holdem':'stud'}"><b>${t('t'+k)}</b><span>${t('d'+k)}</span><ul><li>${t('a'+k)}</li><li>${t('b'+k)}</li><li>${t('c'+k)}</li></ul></button>`).join('');
  setSub();renderRank();if(G)render();
}
LI.onchange=()=>{L=LI.value;try{localStorage.setItem(LK,L)}catch(e){}applyLang()};
applyLang();
window.__G=()=>G;
})();
</script>
